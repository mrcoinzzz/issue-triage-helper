name: Issue Triage Suggestion

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: read

jobs:
  suggest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Triage issue
        id: triage
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$ISSUE_BODY" > /tmp/issue-body.md
          issue-triage-helper \
            --title "$ISSUE_TITLE" \
            --body-file /tmp/issue-body.md \
            --format json \
            --github-output "$GITHUB_OUTPUT" > /tmp/triage.json
      - name: Add summary
        run: |
          {
            echo "## Issue triage suggestion"
            echo
            echo "**Labels:** ${{ steps.triage.outputs.labels }}"
            echo
            echo "**Confidence:** ${{ steps.triage.outputs.confidence }}"
            echo
            echo '```json'
            cat /tmp/triage.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
